<div class="space-y-6 flex flex-col w-full animate-fade-in">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-white dark:bg-slate-800 p-5 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700">
            <h3 class="text-lg font-bold mb-4 border-b pb-2 border-slate-200 dark:border-slate-700">Status Kehadiran Hari Ini</h3>
            <div class="flex flex-col items-center justify-center py-2 space-y-4">
                
                <div class="w-full px-4 mb-2">
                    <select id="absensi-jabatan-selector" onchange="renderDynamicAbsensiUI()" class="w-full p-2 border border-blue-300 dark:border-blue-600 rounded bg-blue-50 dark:bg-blue-900/30 text-sm font-bold text-blue-700 dark:text-blue-400 outline-none hidden"></select>
                </div>

                <div class="text-4xl font-mono font-bold text-blue-600 dark:text-blue-400" id="current-time">00:00:00</div>
                <div class="text-sm font-semibold text-slate-500 dark:text-slate-400" id="current-date">Memuat...</div>
                
                <div id="dynamic-absensi-container" class="w-full mt-4 flex justify-center px-4">
                    <p class="text-xs text-slate-400 italic"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Memuat modul absensi...</p>
                </div>

            </div>
        </div>
        
        <div class="bg-white dark:bg-slate-800 p-5 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700">
            <div class="flex justify-between items-center mb-4 border-b pb-2 border-slate-200 dark:border-slate-700">
                <h3 class="text-lg font-bold">Riwayat Cuti Saya</h3>
                <button onclick="toggleModal('modal-cuti')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-semibold transition-colors shadow-sm"><i class="fa-solid fa-plane-departure mr-1"></i> Ajukan Cuti</button>
            </div>
            <div class="overflow-x-auto max-h-[220px] custom-scrollbar">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-slate-100 dark:bg-slate-700 sticky top-0">
                        <tr><th class="p-3 rounded-tl-lg">Tanggal Pengajuan</th><th class="p-3">Keterangan</th><th class="p-3 rounded-tr-lg">Status</th></tr>
                    </thead>
                    <tbody id="table-body-cuti" class="divide-y divide-slate-100 dark:divide-slate-700"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="bg-white dark:bg-slate-800 p-5 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 border-b pb-2 border-slate-200 dark:border-slate-700 gap-4">
            <h3 class="text-lg font-bold"><i class="fa-solid fa-clock-rotate-left mr-2 text-blue-500"></i>Riwayat Absensi & Izin</h3>
            <div class="flex items-center space-x-2">
                <label for="filter-bulan-absensi" class="text-sm font-medium text-slate-600 dark:text-slate-300">Bulan:</label>
                <input type="month" id="filter-bulan-absensi" onchange="renderRiwayatAbsensi()" class="p-2 border border-slate-300 dark:border-slate-600 rounded bg-slate-50 dark:bg-slate-700 outline-none focus:ring-2 focus:ring-blue-500 text-sm font-bold">
            </div>
        </div>
        <div class="overflow-x-auto max-h-[350px] custom-scrollbar">
            <table class="w-full text-left text-sm whitespace-nowrap">
                <thead class="bg-slate-100 dark:bg-slate-700 sticky top-0 shadow-sm">
                    <tr><th class="p-3 rounded-tl-lg">Tanggal</th><th class="p-3">Jam Masuk</th><th class="p-3">Jam Keluar</th><th class="p-3 rounded-tr-lg">Status</th></tr>
                </thead>
                <tbody id="table-body-absensi" class="divide-y divide-slate-100 dark:divide-slate-700">
                    <tr><td colspan="4" class="p-8 text-center text-slate-500">Memuat riwayat absensi...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="modal-izin-menit" class="hidden fixed inset-0 bg-slate-900/80 z-[100] flex items-center justify-center backdrop-blur-sm animate-fade-in">
    <div class="bg-white dark:bg-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl transform transition-all scale-100 animate-slide-up border border-slate-100 dark:border-slate-700">
        <div class="flex justify-between items-center mb-4 border-b pb-2 border-slate-100 dark:border-slate-700">
            <h2 class="text-xl font-bold"><i class="fa-solid fa-person-walking-arrow-right mr-2 text-orange-500"></i>Izin Keluar (Sementara)</h2>
            <button onclick="toggleModal('modal-izin-menit')" class="text-slate-400 hover:text-red-500 transition-colors"><i class="fa-solid fa-times text-xl"></i></button>
        </div>
        <form id="form-izin-menit" onsubmit="submitIzinMenit(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-bold mb-1">Berapa Menit?</label>
                <input type="number" id="izin-durasi" required min="5" max="300" class="w-full p-2 border border-slate-300 dark:border-slate-600 rounded bg-slate-50 dark:bg-slate-700 outline-none focus:ring-2 focus:ring-orange-500" placeholder="Contoh: 60">
            </div>
            <div>
                <label class="block text-sm font-bold mb-1">Keperluan / Alasan</label>
                <textarea id="izin-alasan" required rows="2" class="w-full p-2 border border-slate-300 dark:border-slate-600 rounded bg-slate-50 dark:bg-slate-700 outline-none focus:ring-2 focus:ring-orange-500" placeholder="Ke bank, jemput anak, dll..."></textarea>
            </div>
            <div class="flex justify-end space-x-3 pt-2">
                <button type="button" onclick="toggleModal('modal-izin-menit')" class="px-4 py-2 bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-white rounded font-semibold transition-colors">Batal</button>
                <button type="submit" class="px-4 py-2 bg-orange-500 hover:bg-orange-600 text-white rounded font-semibold shadow-sm transition-colors">Kirim Izin</button>
            </div>
        </form>
    </div>
</div>
