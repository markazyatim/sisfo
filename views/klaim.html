<div class="space-y-6 flex flex-col w-full animate-fade-in">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-white dark:bg-slate-800 p-5 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700">
            <h3 class="font-bold mb-4 border-b border-slate-200 dark:border-slate-700 pb-2">Form Klaim Baru</h3>
            <form id="form-klaim" onsubmit="handleKlaimSubmit(event)" class="space-y-4">
                <input type="text" id="klaim-judul" required placeholder="Judul Klaim / Keterangan" class="w-full p-2 border border-slate-300 dark:border-slate-600 rounded bg-slate-50 dark:bg-slate-700 outline-none focus:ring-2 focus:ring-primary">
                <input type="number" id="klaim-nominal" required placeholder="Nominal (Tanpa titik)" class="w-full p-2 border border-slate-300 dark:border-slate-600 rounded bg-slate-50 dark:bg-slate-700 outline-none focus:ring-2 focus:ring-primary">
                <div>
                    <label class="block text-xs font-bold mb-1 text-slate-500">Unggah Bukti Struk/Nota</label>
                    <input type="file" id="klaim-gambar" accept="image/*" required onchange="handleImageCompress(event)" class="w-full text-sm">
                </div>
                <div id="preview-container" class="hidden mt-2 border border-dashed border-slate-300 dark:border-slate-600 p-2 rounded">
                    <p id="compress-status" class="text-xs"></p>
                    <img id="klaim-preview" src="" class="h-32 object-cover rounded mt-1">
                </div>
                <button type="submit" class="w-full bg-primary text-white font-bold py-2 rounded hover:bg-opacity-90 transition-colors shadow-sm">Kirim Klaim Operasional</button>
            </form>
        </div>
        
        <div class="bg-white dark:bg-slate-800 p-5 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700">
            <h3 class="font-bold mb-4 border-b border-slate-200 dark:border-slate-700 pb-2">Riwayat Klaim</h3>
            <ul id="list-riwayat-klaim" class="space-y-3"></ul>
        </div>
    </div>
</div>
