<div class="h-full flex flex-col animate-fade-in">
    <div class="mb-4 bg-teal-50 dark:bg-teal-900/20 border-l-4 border-teal-500 p-4 rounded-r-lg flex justify-between items-center shadow-sm shrink-0">
        <div>
            <h2 class="text-lg font-bold text-teal-800 dark:text-teal-300 flex items-center"><i class="fa-solid fa-calendar-alt mr-2"></i> Kalender Pendidikan (Satu Tahun)</h2>
            <p class="text-sm text-teal-700 dark:text-teal-400 mt-1">Agenda yayasan, tenggat tugas, hari libur, dan penanggalan Islam (Umm al-Qura).</p>
        </div>
        <button onclick="openKalenderModal()" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded text-sm font-bold shadow-md transition-colors hidden shrink-0" id="btn-add-kalender">
            <i class="fa-solid fa-plus mr-1"></i> Tambah Agenda
        </button>
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 flex-1 flex flex-col overflow-hidden">
        <div class="flex justify-between items-center p-4 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50">
            <button onclick="changeKalenderYear(-1)" class="p-2 px-4 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded shadow-sm hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors font-bold"><i class="fa-solid fa-chevron-left"></i> <span class="hidden sm:inline ml-1">Tahun Sebelumnya</span></button>
            <div class="text-center">
                <h3 class="text-2xl font-black text-slate-800 dark:text-white tracking-widest" id="kalender-year-label">2026</h3>
            </div>
            <button onclick="changeKalenderYear(1)" class="p-2 px-4 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded shadow-sm hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors font-bold"><span class="hidden sm:inline mr-1">Tahun Berikutnya</span> <i class="fa-solid fa-chevron-right"></i></button>
        </div>
        
        <div class="p-3 border-b border-slate-100 dark:border-slate-700 flex flex-wrap justify-center gap-4 text-xs font-semibold text-slate-600 dark:text-slate-300 bg-slate-50 dark:bg-slate-900/50">
            <span class="flex items-center"><span class="w-3 h-3 rounded bg-red-100 border border-red-500 mr-2 shadow-sm"></span> Ahad / Hari Libur</span>
            <span class="flex items-center"><span class="w-3 h-3 rounded bg-purple-500 border border-purple-700 mr-2 shadow-sm animate-pulse"></span> Hari Ini</span>
            <span class="flex items-center"><span class="w-3 h-3 rounded bg-orange-500 border border-orange-700 mr-2 shadow-sm"></span> Deadline Tugas</span>
        </div>

        <div id="kalender-12-months-grid" class="flex-1 overflow-y-auto custom-scrollbar p-4 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-6">
            </div>
    </div>
</div>
